name: build-crimson

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset msvc-x64-release

      - name: Build
        run: cmake --build --preset msvc-x64-release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: crimson-injector
          path: out/bin/
          if-no-files-found: error
