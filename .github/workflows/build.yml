name: build-crimson

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path drop | Out-Null
          Get-ChildItem -Recurse -Include crimson_injector.exe,crimson_client.dll |
            Where-Object { $_.FullName -notmatch '\\drop\\' } |
            Copy-Item -Destination drop
          Get-ChildItem drop

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: crimson-injector
          path: drop/*
          if-no-files-found: error
